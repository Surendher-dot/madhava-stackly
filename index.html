<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GitHub Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        header {
            background: #24292e;
            color: white;
            padding: 20px;
        }

        main {
            padding: 40px;
        }

        .card {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        button {
            background: #0366d6;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #024fa2;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My GitHub Website</h1>
    </header>

    <main>
        <div class="card">
            <h2>Hello World 🚀</h2>
            <p>This is a sample HTML page hosted on GitHub.</p>

            <button onclick="showMessage()">
                Click Me
            </button>
        </div>
    </main>

    <script>
        function showMessage() {
            alert("Hello from GitHub Pages!");
        }
    </script>

</body>
</html>
